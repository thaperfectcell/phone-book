<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Телефонный справочник</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
        form { background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input { margin: 5px 0; padding: 8px; width: 100%; box-sizing: border-box; }
        button { padding: 8px 16px; margin: 5px 5px 5px 0; cursor: pointer; border: none; border-radius: 4px; }
        .btn-add { background: #4CAF50; color: white; }
        .btn-edit { background: #2196F3; color: white; }
        .btn-delete { background: #f44336; color: white; }
        .btn-cancel { background: #9E9E9E; color: white; }
        #message { margin: 10px 0; font-weight: bold; }
    </style>
</head>
<body>
    <h1>📞 Телефонный справочник</h1>
    <div id="message"></div>

    <!-- Форма создания/редактирования -->
    <form id="contactForm">
        <h2 id="formTitle">Новый контакт</h2>
        <input type="hidden" id="contactId">
        <input type="text" id="username" placeholder="Имя (обязательно)" required>
        <input type="email" id="email" placeholder="Email">
        <input type="text" id="mobile" placeholder="Мобильный телефон">
        <input type="text" id="home" placeholder="Домашний телефон">
        <button type="submit" class="btn-add" id="submitBtn">Создать контакт</button>
        <button type="button" class="btn-cancel" id="cancelBtn" style="display:none;">Отмена</button>
    </form>

    <!-- Таблица контактов -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Email</th>
                <th>Мобильный</th>
                <th>Домашний</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="contactsTable"></tbody>
    </table>

    <script>
        const API_URL = 'https://phone-book-55h7.onrender.com';

        // Показать сообщение
        function showMessage(text, isError = false) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.style.color = isError ? 'red' : 'green';
            setTimeout(() => el.textContent = '', 3000);
        }

        // Загрузить и отобразить все контакты
        async function loadContacts() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error('Ошибка загрузки');
                const contacts = await res.json();
                renderTable(contacts);
            } catch (err) {
                showMessage('Не удалось загрузить контакты: ' + err.message, true);
            }
        }

        // Отрисовать таблицу
        function renderTable(contacts) {
            const tbody = document.getElementById('contactsTable');
            tbody.innerHTML = '';
            if (!contacts || contacts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Контактов пока нет</td></tr>';
                return;
            }
            contacts.forEach(c => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${c.id}</td>
                    <td>${escapeHtml(c.username)}</td>
                    <td>${escapeHtml(c.email || '')}</td>
                    <td>${escapeHtml(c.mobile || '')}</td>
                    <td>${escapeHtml(c.home || '')}</td>
                    <td>
                        <button class="btn-edit" onclick="editContact(${c.id})">Редактировать</button>
                        <button class="btn-delete" onclick="deleteContact(${c.id})">Удалить</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Экранирование HTML (защита от XSS)
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // Создать или обновить контакт
        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('contactId').value;
            const contact = {
                username: document.getElementById('username').value.trim(),
                email: document.getElementById('email').value.trim(),
                mobile: document.getElementById('mobile').value.trim(),
                home: document.getElementById('home').value.trim(),
            };

            try {
                let res;
                if (id) {
                    // Обновление
                    res = await fetch(`${API_URL}/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(contact),
                    });
                } else {
                    // Создание
                    res = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(contact),
                    });
                }
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.message || 'Ошибка сохранения');
                }
                showMessage(id ? 'Контакт обновлён' : 'Контакт создан');
                resetForm();
                loadContacts();
            } catch (err) {
                showMessage(err.message, true);
            }
        });

        // Заполнить форму для редактирования
        async function editContact(id) {
            try {
                const res = await fetch(`${API_URL}/${id}`);
                if (!res.ok) throw new Error('Контакт не найден');
                const c = await res.json();
                document.getElementById('contactId').value = c.id;
                document.getElementById('username').value = c.username;
                document.getElementById('email').value = c.email || '';
                document.getElementById('mobile').value = c.mobile || '';
                document.getElementById('home').value = c.home || '';
                document.getElementById('formTitle').textContent = 'Редактирование контакта';
                document.getElementById('submitBtn').textContent = 'Сохранить изменения';
                document.getElementById('submitBtn').className = 'btn-edit';
                document.getElementById('cancelBtn').style.display = 'inline-block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (err) {
                showMessage(err.message, true);
            }
        }

        // Удалить контакт
        async function deleteContact(id) {
            if (!confirm('Удалить этот контакт?')) return;
            try {
                const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (!res.ok && res.status !== 204) {
                    throw new Error('Ошибка удаления');
                }
                showMessage('Контакт удалён');
                loadContacts();
            } catch (err) {
                showMessage(err.message, true);
            }
        }

        // Сбросить форму
        function resetForm() {
            document.getElementById('contactForm').reset();
            document.getElementById('contactId').value = '';
            document.getElementById('formTitle').textContent = 'Новый контакт';
            document.getElementById('submitBtn').textContent = 'Создать контакт';
            document.getElementById('submitBtn').className = 'btn-add';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        document.getElementById('cancelBtn').addEventListener('click', resetForm);

        // Загружаем контакты при старте
        loadContacts();
    </script>
</body>
</html>
